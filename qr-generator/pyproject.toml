[project]
name = "qr-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "qrcode[pil]>=7.4,<9.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
qr-generator = "qr_generator:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
